<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선생님 프롬프트 학교</title>
<meta name="description" content="제미나이 노트북(구 NotebookLM)과 제미나이 수업·업무 활용 프롬프트 모음">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232e5b4f'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='%23f2a33a' font-family='sans-serif' font-weight='700'%3E%23%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="eyebrow">제미나이 노트북 · 제미나이 교원 연수</p>
    <h1 class="title">선생님 <span class="hl">프롬프트 학교</span></h1>
    <p class="lead">연수에서 실제로 돌려 보고 효과를 확인한 프롬프트입니다. <b>복사하기</b>를 눌러 붙여 넣고, <span class="ph">[대괄호]</span> 부분만 내 상황에 맞게 바꿔 쓰세요.</p>
    <div class="legend">
      <span><b class="t-role">#역할</b> 누구로서</span>
      <span><b class="t-cmd">#명령</b> 무엇을</span>
      <span><b class="t-ctx">#맥락</b> 어떤 조건에서</span>
      <span><b class="t-fmt">#형식</b> 어떤 모양으로</span>
      <span><span class="ph">[자리표시]</span> 바꿔 넣을 곳</span>
    </div>
  </header>
</div>

<div class="bar">
  <div class="wrap">
    <div class="bar-row">
      <div class="seg" role="group" aria-label="도구 선택" id="grp"></div>
      <input class="search" id="q" type="search" placeholder="프롬프트 검색 (예: 오개념, 생활기록부, 퀴즈)" aria-label="프롬프트 검색">
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
</div>

<main class="wrap" id="main" aria-live="polite">
  <p class="empty">불러오는 중…</p>
</main>

<footer>
  <div class="wrap">
    <p>제작: 박성철(오션초등학교) · 학생 개인정보는 넣지 마세요. AI 답변은 반드시 원문(인용 번호)으로 확인하세요.</p>
    <p id="src" class="muted"></p>
  </div>
</footer>

<script type="module">
import { esc, highlight, mark, copyText, store, GROUPS, loadData } from '/assets/common.js';

const state = { data: null, grp: store('ps.grp') || 'all', cat: store('ps.cat') || '', q: '' };
const $ = (s) => document.querySelector(s);

function visibleCats() {
  return state.data.categories.filter((c) => state.grp === 'all' || c.grp === state.grp);
}

function renderGroups() {
  const groups = ['all', ...new Set(state.data.categories.map((c) => c.grp))];
  $('#grp').innerHTML = groups
    .map((g) => `<button type="button" data-g="${g}" aria-pressed="${g === state.grp}">${g === 'all' ? '전체' : esc(GROUPS[g] || g)}</button>`)
    .join('');
}

function renderTabs() {
  const cats = visibleCats();
  if (!cats.find((c) => c.id === state.cat)) state.cat = cats[0]?.id || '';
  $('#tabs').innerHTML = cats
    .map((c) => `<button class="tab" role="tab" data-c="${esc(c.id)}" aria-selected="${c.id === state.cat && !state.q}">${esc(c.label)}<span class="n">${c.items.length}</span></button>`)
    .join('');
}

function card(it, cat) {
  const q = state.q;
  return `<article class="card">
    <div class="card-head">
      <div>
        <h3>${mark(esc(it.title), q)}</h3>
        ${it.meta ? `<p class="meta">${esc(it.meta)}${cat && q ? ` · <span class="muted">${esc(cat.label)}</span>` : ''}</p>` : (cat && q ? `<p class="meta muted">${esc(cat.label)}</p>` : '')}
      </div>
      <button class="copy" type="button" data-id="${esc(it.id)}">복사하기</button>
    </div>
    <pre class="prompt">${highlight(it.text, q)}</pre>
    ${it.check ? `<p class="check"><b>확인할 것</b> ${esc(it.check)}</p>` : '<div style="height:14px"></div>'}
  </article>`;
}

function renderMain() {
  const main = $('#main');
  if (state.q) {
    const q = state.q.toLowerCase();
    const hits = [];
    for (const c of visibleCats()) for (const it of c.items) {
      if ([it.title, it.meta, it.text, it.check].join(' ').toLowerCase().includes(q)) hits.push([it, c]);
    }
    main.innerHTML = `<div class="cat-head"><h2>‘${esc(state.q)}’ 검색 결과 ${hits.length}개</h2></div>` +
      (hits.length ? `<div class="cards">${hits.map(([it, c]) => card(it, c)).join('')}</div>` : '<p class="empty">맞는 프롬프트가 없습니다.</p>');
    return;
  }
  const c = state.data.categories.find((x) => x.id === state.cat);
  if (!c) { main.innerHTML = '<p class="empty">아직 프롬프트가 없습니다.</p>'; return; }
  main.innerHTML = `<div class="cat-head">
      <span class="grp-badge">${esc(GROUPS[c.grp] || c.grp)}</span>
      <h2>${esc(c.label)}</h2>${c.intro ? `<p>${esc(c.intro)}</p>` : ''}
    </div>
    ${c.items.length ? `<div class="cards">${c.items.map((it) => card(it)).join('')}</div>` : '<p class="empty">이 탭에는 아직 프롬프트가 없습니다.</p>'}`;
}

function renderAll() { renderGroups(); renderTabs(); renderMain(); }

document.addEventListener('click', async (e) => {
  const g = e.target.closest('[data-g]');
  if (g) { state.grp = g.dataset.g; store('ps.grp', state.grp); state.cat = ''; renderAll(); return; }
  const t = e.target.closest('[data-c]');
  if (t) { state.cat = t.dataset.c; store('ps.cat', state.cat); state.q = ''; $('#q').value = ''; renderTabs(); renderMain(); window.scrollTo({ top: $('.bar').offsetTop, behavior: 'smooth' }); return; }
  const b = e.target.closest('.copy');
  if (b) {
    let it;
    for (const c of state.data.categories) { it = c.items.find((x) => x.id === b.dataset.id); if (it) break; }
    const ok = it && (await copyText(it.text));
    b.textContent = ok ? '복사됨 ✓' : '복사 실패';
    b.classList.toggle('done', !!ok);
    setTimeout(() => { b.textContent = '복사하기'; b.classList.remove('done'); }, 1600);
  }
});

let timer;
$('#q').addEventListener('input', (e) => {
  clearTimeout(timer);
  timer = setTimeout(() => { state.q = e.target.value.trim(); renderTabs(); renderMain(); }, 150);
});

const { data, live } = await loadData();
state.data = data;
$('#src').textContent = live ? '' : '오프라인 사본(seed.json)을 보여 주고 있습니다.';
renderAll();
</script>
</body>
</html>
